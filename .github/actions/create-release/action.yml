# https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax

name: Create Release
description: Create a release for a tag in your repository

inputs:
  token:
    description: 'The token with access to your repository scoped in as a secret'
    required: true
  tag-name:
    description: 'The name of the tag. This should come from the webhook payload, `github.GITHUB_REF` when a user pushes a new tag'
    required: true

runs:
  using: node24
  main: index.mjs

branding:
  icon: tag
  color: gray-dark
