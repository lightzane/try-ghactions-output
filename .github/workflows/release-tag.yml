# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Create Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      MY_ACTION_PATH: ./.github/actions/create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: ${{ env.MY_ACTION_PATH }}

      - name: Install release deps
        working-directory: ${{ env.MY_ACTION_PATH }}
        run: pnpm install

      - name: Create release for Tag
        uses: ./.github/actions/create-release # `uses` value must be static
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag-name: ${{ github.ref }} # github.ref -- (docs) https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context
